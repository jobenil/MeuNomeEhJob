  <line x1="400" y1="500" x2="410" y2="497" stroke="#4a4f57" stroke-width="6"/>
  <line x1="520" y1="500" x2="505" y2="497" stroke="#4a4f57" stroke-width="6"/>
  <circle cx="410" cy="515" r="18" fill="#4a4f57"/>
  <circle cx="505" cy="515" r="18" fill="#4a4f57"/>
  <circle cx="410" cy="515" r="6" fill="#8c939c"/>
  <circle cx="505" cy="515" r="6" fill="#8c939c"/>

  <!-- Compras no carrinho -->
  <rect x="365" y="380" width="70" height="16" rx="8" fill="#d8a35f" transform="rotate(-18 400 388)"/>
  <circle cx="445" cy="392" r="14" fill="#6fae4e"/>
  <circle cx="460" cy="388" r="12" fill="#6fae4e"/>
  <circle cx="455" cy="402" r="13" fill="#6fae4e"/>
  <rect x="480" y="372" width="28" height="48" rx="3" fill="#f6efe2" stroke="#d8cdb8" stroke-width="1.5"/>
  <rect x="480" y="372" width="28" height="10" rx="2" fill="#e0575b"/>
  <circle cx="527" cy="398" r="13" fill="#f2994a"/>
  <circle cx="542" cy="390" r="11" fill="#f2994a"/>

  <!-- Potinho de iogurte no carrinho, ligando a cena ao tema -->
  <rect x="505" y="378" width="20" height="26" rx="4" fill="#4c8bf5"/>
